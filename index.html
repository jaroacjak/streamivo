
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>Streamivo – Online TV</title>

<style>
:root{
  --bg:#080b12;
  --panel:#111722;
  --panel2:#182130;
  --accent:#19c5c0;
  --red:#e50938;
  --text:#f5f7fb;
  --muted:#929cad;
  --border:rgba(255,255,255,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select{font:inherit}
button{cursor:pointer;color:inherit}

header{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  background:#080b12;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{color:var(--red)}

nav{display:flex;gap:6px}

.nav-btn{
  background:transparent;
  color:var(--muted);
  border:0;
  padding:11px 14px;
  border-radius:9px;
}

.nav-btn.active,
.nav-btn:hover{
  color:white;
  background:var(--panel2);
}

.clock{
  color:var(--muted);
  font-size:14px;
}

main{
  max-width:1400px;
  margin:auto;
  padding:22px;
}

.page{display:none}
.page.active{display:block}

.section-title{
  font-size:23px;
  font-weight:bold;
  margin:10px 0 18px;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 290px;
  gap:20px;
}

.player-card,
.sidebar,
.content-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
}

.video-wrap{
  background:black;
  position:relative;
  aspect-ratio:16/9;
}

video{
  width:100%;
  height:100%;
  display:block;
  background:black;
  object-fit:contain;
}

.player-overlay{
  position:absolute;
  top:15px;
  left:15px;
  display:flex;
  gap:8px;
  pointer-events:none;
}

.live-badge{
  background:var(--red);
  font-size:11px;
  font-weight:bold;
  padding:6px 9px;
  border-radius:5px;
}

.channel-badge{
  background:#000a;
  padding:6px 9px;
  border-radius:5px;
  font-size:12px;
}

.center-play{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  opacity:0;
  transition:.2s;
}

.center-play.show{opacity:1}

.center-play span{
  width:65px;
  height:65px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#000a;
  font-size:28px;
}

.controls{padding:12px 14px}

.timeline{
  width:100%;
  height:5px;
  accent-color:var(--accent);
  margin:5px 0 15px;
  cursor:pointer;
}

.control-row{
  display:flex;
  align-items:center;
  gap:17px;
  flex-wrap:wrap;
}

.control-btn{
  background:transparent;
  border:0;
  padding:5px;
  font-size:20px;
  min-width:30px;
}

.control-btn:hover{color:var(--accent)}

.volume{width:90px;accent-color:var(--accent)}

.player-clock{
  font-size:19px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.live-text{
  font-size:16px;
  font-weight:bold;
}

.program-title{
  font-size:16px;
  font-weight:bold;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.player-spacer{flex:1}

.status{
  padding:10px 14px;
  font-size:12px;
  color:var(--muted);
  border-top:1px solid var(--border);
}

.program-now{
  padding:14px;
  border-top:1px solid var(--border);
  background:#0d131e;
}

.program-now strong{
  display:block;
  margin-bottom:6px;
}

.program-now small{
  display:block;
  color:var(--muted);
  margin-top:5px;
}

.sidebar{padding:15px}

.search,.select{
  width:100%;
  padding:11px;
  border-radius:8px;
  background:var(--bg);
  border:1px solid var(--border);
  color:white;
  margin-bottom:12px;
}

.channel{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid transparent;
  background:var(--panel2);
  border-radius:10px;
  margin-bottom:9px;
  text-align:left;
}

.channel:hover,
.channel.active{
  border-color:var(--accent);
  background:#19c5c018;
}

.channel-logo{
  width:40px;
  height:40px;
  border-radius:9px;
  display:grid;
  place-items:center;
  font-weight:bold;
  background:#222c3b;
  flex-shrink:0;
}

.channel-info{flex:1}
.channel-name{font-weight:bold}
.channel-sub{color:var(--muted);font-size:12px;margin-top:4px}

.empty{
  color:var(--muted);
  padding:15px;
  text-align:center;
}

.content-card{padding:18px;margin-bottom:15px}

.guide-row{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:12px;
  padding:14px;
  border-bottom:1px solid var(--border);
}

.guide-row.current{background:#19c5c010}

.guide-time{
  color:var(--accent);
  font-weight:bold;
}

.guide-row p{
  color:var(--muted);
  font-size:13px;
  margin:6px 0;
}

.archive-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.archive-item{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
}

.archive-item h4{margin:0 0 8px}
.archive-item p{color:var(--muted);font-size:13px}

footer{
  padding:25px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  border-top:1px solid var(--border);
  margin-top:30px;
}

@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  header{padding:0 12px}
  .clock{display:none}
  main{padding:13px}
}

@media(max-width:480px){
  .logo{font-size:21px}
  nav{gap:2px}
  .nav-btn{padding:9px 7px;font-size:12px}
  .control-row{gap:11px}
  .player-clock{font-size:16px}
  .live-text,.program-title{font-size:13px}
  .volume{width:65px}
  .archive-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="logo">STREAM<span>IVO</span></div>

  <nav>
    <button class="nav-btn active" data-page="tv">Živé TV</button>
    <button class="nav-btn" data-page="guide">TV program</button>
    <button class="nav-btn" data-page="archive">Archív</button>
  </nav>

  <div class="clock" id="clock">--:--:--</div>
</header>

<main>

<!-- LIVE TV -->
<section class="page active" id="tvPage">

  <div class="section-title">Živé vysielanie</div>

  <div class="layout">

    <div class="player-card">

      <div class="video-wrap" id="videoWrap">

        <video id="video" playsinline autoplay></video>

        <div class="player-overlay">
          <span class="live-badge" id="liveBadge">● LIVE</span>
          <span class="channel-badge" id="playerChannel">JOJ</span>
        </div>

        <div class="center-play" id="centerPlay">
          <span id="centerPlayIcon">▶</span>
        </div>

      </div>

      <div class="controls">

        <input
          type="range"
          id="timeline"
          class="timeline"
          min="0"
          max="100"
          value="100"
        >

        <div class="control-row">

          <button class="control-btn" id="playBtn" title="Play/Pause">▶</button>

          <button class="control-btn" id="muteBtn" title="Zvuk">🔊</button>

          <input
            type="range"
            class="volume"
            id="volume"
            min="0"
            max="1"
            step="0.05"
            value="1"
          >

          <span class="player-clock" id="playerClock">--:--:--</span>

          <span class="live-text" id="liveText">● Naživo</span>

          <span class="program-title" id="programTitle">
            TV program
          </span>

          <span class="player-spacer"></span>

          <button class="control-btn" id="fitBtn" title="Zmeniť zobrazenie">▣</button>

          <button class="control-btn" id="listBtn" title="Zoznam kanálov">☷</button>

          <button class="control-btn" id="fullscreenBtn" title="Fullscreen">⛶</button>

        </div>

      </div>

      <div class="status" id="status">
        Vyber kanál.
      </div>

      <div class="program-now" id="programNow">
        <strong>TV program</strong>
        <small>Načítavam programové údaje…</small>
      </div>

    </div>

    <aside class="sidebar" id="sidebar">

      <input
        class="search"
        id="search"
        type="search"
        placeholder="🔍 Hľadať TV..."
      >

      <div id="channelList"></div>

    </aside>

  </div>

</section>

<!-- TV PROGRAM -->
<section class="page" id="guidePage">

  <div class="section-title">TV program</div>

  <div class="content-card">

    <select class="select" id="guideChannel"></select>

    <input
      class="select"
      type="date"
      id="guideDate"
    >

    <div id="guideList"></div>

  </div>

</section>

<!-- ARCHIV -->
<section class="page" id="archivePage">

  <div class="section-title">TV archív</div>

  <div class="content-card">

    <h3>Archív videí</h3>

    <p style="color:var(--muted)">
      Tu môžeš zobrazovať vlastné alebo licencované archívne videá.
    </p>

    <select class="select" id="archiveChannel"></select>

    <input class="select" type="date" id="archiveDate">

    <input
      class="search"
      type="search"
      id="archiveSearch"
      placeholder="🔍 Hľadať reláciu..."
    >

    <div id="archiveList"></div>

  </div>

</section>

</main>

<footer>Streamivo · Online TV</footer>

<script src="./hls.min.js"></script>

<script>
"use strict";

/* ===============================
   KANÁLY
================================ */

const channels = [
  {
    id:"joj",
    name:"JOJ",
    logo:"JOJ",
    aliases:[
      "joj",
      "joj.sk",
      "joj.cz"
    ],
    stream:"https://live.cdn.joj.sk/live/andromeda/joj-1080.m3u8"
  },
  {
    id:"markiza",
    name:"Markíza",
    logo:"M",
    aliases:[
      "markiza",
      "markíza",
      "markiza.sk",
      "markiza.cz"
    ],
    stream:"https://cdnsk003.panaccess.com/local/Markiza/index.m3u8"
  }
];

/* ===============================
   EPG
================================ */

const EPG_URL =
"https://iptv-epg.org/files/epg-cz.xml.gz";

let epgChannels=[];
let epgPrograms=[];
let epgLoaded=false;

/* Archív vlastných/licencovaných videí */
const archiveData=[];

/* ===============================
   ELEMENTY
================================ */

const video=document.getElementById("video");
const videoWrap=document.getElementById("videoWrap");
const channelList=document.getElementById("channelList");
const searchInput=document.getElementById("search");
const statusElement=document.getElementById("status");
const playerChannel=document.getElementById("playerChannel");
const timeline=document.getElementById("timeline");

const playBtn=document.getElementById("playBtn");
const backBtn=document.getElementById("backBtn");
const forwardBtn=document.getElementById("forwardBtn");
const liveBtn=document.getElementById("liveBtn");
const muteBtn=document.getElementById("muteBtn");
const volumeSlider=document.getElementById("volume");
const fullscreenBtn=document.getElementById("fullscreenBtn");

const centerPlay=document.getElementById("centerPlay");
const centerPlayIcon=document.getElementById("centerPlayIcon");
const liveBadge=document.getElementById("liveBadge");
const playerClock=document.getElementById("playerClock");
const liveText=document.getElementById("liveText");
const programTitle=document.getElementById("programTitle");
const programNow=document.getElementById("programNow");

let hls=null;
let currentChannel=null;
let currentMode="live";
let isSeeking=false;
let fitMode=0;

/* ===============================
   NAVIGÁCIA
================================ */

const pages={
  tv:document.getElementById("tvPage"),
  guide:document.getElementById("guidePage"),
  archive:document.getElementById("archivePage")
};

document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".nav-btn")
      .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    Object.entries(pages).forEach(([key,element])=>{
      element.classList.toggle(
        "active",
        key===btn.dataset.page
      );
    });
  };
});

/* ===============================
   KANÁLY
================================ */

function renderChannels(filter=""){
  channelList.innerHTML="";

  const list=channels.filter(c=>
    c.name.toLowerCase().includes(filter.toLowerCase())
  );

  if(!list.length){
    channelList.innerHTML=
      '<div class="empty">Kanál sa nenašiel.</div>';
    return;
  }

  list.forEach(channel=>{
    const button=document.createElement("button");

    button.className="channel"+
      (currentChannel?.id===channel.id?" active":"");

    button.innerHTML=`
      <div class="channel-logo">
        ${escapeHTML(channel.logo)}
      </div>

      <div class="channel-info">
        <div class="channel-name">
          ${escapeHTML(channel.name)}
        </div>

        <div class="channel-sub">
          Živé vysielanie
        </div>
      </div>

      <div>▶</div>
    `;

    button.onclick=()=>loadLive(channel);

    channelList.appendChild(button);
  });
}

/* ===============================
   PREHRÁVAČ
================================ */

function destroyHLS(){
  if(hls){
    hls.destroy();
    hls=null;
  }
}

function loadSource(url){
  destroyHLS();

  video.pause();
  video.removeAttribute("src");
  video.load();

  if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src=url;

    video.play().catch(()=>{
      statusElement.textContent=
        "Stream pripravený. Stlač Play.";
    });

  }else if(window.Hls&&Hls.isSupported()){

    hls=new Hls({
      enableWorker:true,
      lowLatencyMode:true
    });

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      video.play().catch(()=>{
        statusElement.textContent=
          "Stream pripravený. Stlač Play.";
      });
    });

    hls.on(Hls.Events.ERROR,(event,data)=>{
      if(!data.fatal)return;

      statusElement.textContent=
        "Chyba streamu: "+data.details;

      if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
        hls.startLoad();
      }else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
        hls.recoverMediaError();
      }else{
        destroyHLS();
      }
    });

  }else{
    statusElement.textContent=
      "Prehliadač nepodporuje HLS.";
  }
}

function loadLive(channel){
  currentChannel=channel;
  currentMode="live";

  playerChannel.textContent=channel.name;
  liveBadge.style.display="";
  liveText.style.display="";
  liveText.textContent="● Naživo";

  renderChannels(searchInput.value);

  statusElement.textContent=
    "Načítavam "+channel.name+"…";

  loadSource(channel.stream);
  updateProgramNow();
}

/* ===============================
   PLAY / PAUSE
================================ */

function togglePlayback(){
  if(!currentChannel){
    loadLive(channels[0]);
    return;
  }

  if(video.paused){
    video.play().catch(()=>{
      statusElement.textContent=
        "Prehrávanie sa nepodarilo spustiť.";
    });
  }else{
    video.pause();
  }
}

playBtn.onclick=togglePlayback;
video.onclick=togglePlayback;

video.addEventListener("play",()=>{
  playBtn.textContent="Ⅱ";
  centerPlay.classList.remove("show");

  statusElement.textContent=
    "Prehráva sa: "+(currentChannel?.name||"");
});

video.addEventListener("pause",()=>{
  playBtn.textContent="▶";
  centerPlayIcon.textContent="▶";
  centerPlay.classList.add("show");
});

video.addEventListener("waiting",()=>{
  statusElement.textContent="Načítavam video…";
});

video.addEventListener("playing",()=>{
  centerPlay.classList.remove("show");
});

/* ===============================
   ČASOVÁ OS
================================ */

function updateTimeline(){
  if(isSeeking)return;

  if(video.seekable.length){
    const start=video.seekable.start(0);
    const end=video.seekable.end(video.seekable.length-1);

    timeline.min=start;
    timeline.max=end;
    timeline.value=video.currentTime;
  }else if(Number.isFinite(video.duration)){
    timeline.min=0;
    timeline.max=video.duration;
    timeline.value=video.currentTime;
  }
}

video.addEventListener("timeupdate",updateTimeline);
video.addEventListener("progress",updateTimeline);
video.addEventListener("loadedmetadata",updateTimeline);
video.addEventListener("durationchange",updateTimeline);

timeline.oninput=()=>{
  isSeeking=true;
};

timeline.onchange=()=>{
  if(video.seekable.length){
    video.currentTime=Number(timeline.value);
  }else if(Number.isFinite(video.duration)){
    video.currentTime=Number(timeline.value);
  }

  isSeeking=false;
};

/* ===============================
   NAŽIVO
================================ */

function goLive(){
  if(!currentChannel)return;

  currentMode="live";

  if(video.seekable.length){
    const end=video.seekable.end(
      video.seekable.length-1
    );

    video.currentTime=end;

    video.play().catch(()=>{});

    statusElement.textContent=
      "Práve sleduješ živé vysielanie.";

  }else{
    loadLive(currentChannel);
  }

  liveBadge.style.display="";
  liveText.style.display="";
  liveText.textContent="● Naživo";
}

liveBtn.onclick=goLive;

/* ===============================
   HLASITOSŤ
================================ */

volumeSlider.oninput=()=>{
  video.volume=Number(volumeSlider.value);
  video.muted=video.volume===0;
  updateMute();
};

muteBtn.onclick=()=>{
  video.muted=!video.muted;
  updateMute();
};

video.addEventListener("volumechange",updateMute);

function updateMute(){
  muteBtn.textContent=
    video.muted||video.volume===0?"🔇":"🔊";
}

/* ===============================
   FULLSCREEN
================================ */

fullscreenBtn.onclick=async()=>{
  try{
    if(!document.fullscreenElement){
      await videoWrap.requestFullscreen();
    }else{
      await document.exitFullscreen();
    }
  }catch(error){
    statusElement.textContent=
      "Fullscreen nie je dostupný.";
  }
};

/* ===============================
   ZOBRAZENIE VIDEA
================================ */

document.getElementById("fitBtn").onclick=()=>{
  fitMode=(fitMode+1)%3;

  if(fitMode===0){
    video.style.objectFit="contain";
    statusElement.textContent="Zobrazenie: prispôsobiť.";
  }else if(fitMode===1){
    video.style.objectFit="cover";
    statusElement.textContent="Zobrazenie: vyplniť.";
  }else{
    video.style.objectFit="fill";
    statusElement.textContent="Zobrazenie: roztiahnuť.";
  }
};

/* ===============================
   ZOZNAM KANÁLOV
================================ */

document.getElementById("listBtn").onclick=()=>{
  const sidebar=document.getElementById("sidebar");

  sidebar.style.display=
    sidebar.style.display==="none"?"":"none";
};

/* ===============================
   EPG NAČÍTANIE
================================ */

async function loadEPG(){
  try{
    const response=await fetch(EPG_URL);

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    let bytes=await response.arrayBuffer();

    if(EPG_URL.endsWith(".gz")){
      if(!("DecompressionStream" in window)){
        throw new Error("Gzip nepodporovaný");
      }

      const stream=new Blob([bytes])
        .stream()
        .pipeThrough(new DecompressionStream("gzip"));

      bytes=await new Response(stream).arrayBuffer();
    }

    const xml=new DOMParser().parseFromString(
      new TextDecoder().decode(bytes),
      "application/xml"
    );

    if(xml.querySelector("parsererror")){
      throw new Error("XML chyba");
    }

    epgChannels=[
      ...xml.querySelectorAll("channel")
    ].map(c=>({
      id:c.getAttribute("id"),
      names:[
        ...c.querySelectorAll("display-name")
      ].map(n=>n.textContent.trim())
    }));

    epgPrograms=[
      ...xml.querySelectorAll("programme")
    ].map(p=>({
      channel:p.getAttribute("channel"),
      start:xmltvDate(p.getAttribute("start")),
      stop:xmltvDate(p.getAttribute("stop")),
      title:p.querySelector("title")?.textContent.trim()||"Bez názvu",
      description:p.querySelector("desc")?.textContent.trim()||""
    })).filter(p=>p.start&&p.stop);

    epgLoaded=true;

    statusElement.textContent=
      "TV program načítaný.";

    renderGuide();
    updateProgramNow();

  }catch(error){

    epgLoaded=false;

    statusElement.textContent=
      "EPG nedostupné. Zdroj môže blokovať CORS.";

    programNow.innerHTML=`
      <strong>TV program nedostupný</strong>
      <small>EPG sa nepodarilo načítať.</small>
    `;

    guideList.innerHTML=`
      <div class="empty">
        TV program momentálne nie je dostupný.
      </div>
    `;
  }
}

/* ===============================
   XMLTV DÁTUM
================================ */

function xmltvDate(value){
  if(!value)return null;

  const match=value.match(
    /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{4})?/
  );

  if(!match)return null;

  const zone=match[7]||"+0000";

  const iso=
    `${match[1]}-${match[2]}-${match[3]}`+
    `T${match[4]}:${match[5]}:${match[6]}`+
    `${zone.slice(0,3)}:${zone.slice(3)}`;

  const date=new Date(iso);

  return Number.isNaN(date.getTime())?null:date;
}

/* ===============================
   IDENTIFIKÁCIA STANICE
================================ */

function normalize(value){
  return String(value||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g,"");
}

function getEPGChannel(channel){
  const wanted=channel.aliases.map(normalize);

  /* Presná zhoda */
  let match=epgChannels.find(c=>
    wanted.includes(normalize(c.id))||
    c.names.some(n=>wanted.includes(normalize(n)))
  );

  if(match)return match;

  /* Čiastočná zhoda */
  return epgChannels.find(c=>
    c.names.some(name=>
      wanted.some(w=>{
        const n=normalize(name);
        return n.includes(w)||w.includes(n);
      })
    )
  );
}

/* ===============================
   PROGRAM STANICE
================================ */

function programsFor(channel,date){
  const epg=getEPGChannel(channel);

  if(!epg)return [];

  return epgPrograms
    .filter(p=>
      p.channel===epg.id&&
      p.start&&
      p.stop&&
      localDate(p.start)===date
    )
    .sort((a,b)=>a.start-b.start);
}

function localDate(date){
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,"0");
  const d=String(date.getDate()).padStart(2,"0");

  return `${y}-${m}-${d}`;
}

/* ===============================
   PRÁVE VYSIELANÉ
================================ */

function updateProgramNow(){
  if(!currentChannel||!epgLoaded){
    programTitle.textContent="TV program";
    return;
  }

  const now=new Date();

  const list=programsFor(
    currentChannel,
    localDate(now)
  );

  const current=list.find(p=>
    p.start<=now&&p.stop>now
  );

  const next=list.find(p=>p.start>now);

  if(!current){
    programTitle.textContent="Program nedostupný";
    programNow.innerHTML=`
      <strong>TV program</strong>
      <small>Relácia sa nenašla.</small>
    `;
    return;
  }

  programTitle.textContent=current.title;

  programNow.innerHTML=`
    <strong>📺 ${escapeHTML(current.title)}</strong>

    <small>
      ${formatClock(current.start)}
      – ${formatClock(current.stop)}
      · NAŽIVO
    </small>

    ${next?`
      <small>
        Nasleduje: ${escapeHTML(next.title)}
        · ${formatClock(next.start)}
      </small>
    `:""}

    ${current.description?`
      <small>${escapeHTML(current.description)}</small>
    `:""}
  `;
}

/* ===============================
   TV PROGRAM
================================ */

const guideChannel=document.getElementById("guideChannel");
const guideDate=document.getElementById("guideDate");
const guideList=document.getElementById("guideList");

populateSelect(guideChannel);
guideDate.value=today();

function populateSelect(select){
  select.innerHTML="";

  channels.forEach(channel=>{
    const option=document.createElement("option");

    option.value=channel.id;
    option.textContent=channel.name;

    select.appendChild(option);
  });
}

function renderGuide(){
  const channel=channels.find(
    c=>c.id===guideChannel.value
  );

  const date=guideDate.value;

  if(!channel||!date)return;

  const entries=programsFor(channel,date);

  guideList.innerHTML="";

  if(!entries.length){
    guideList.innerHTML=`
      <div class="empty">
        Program sa nenašiel.
      </div>
    `;
    return;
  }

  entries.forEach(p=>{
    const row=document.createElement("div");

    row.className="guide-row";

    if(p.start<=new Date()&&p.stop>new Date()){
      row.classList.add("current");
    }

    row.innerHTML=`
      <div class="guide-time">
        ${formatClock(p.start)}
        – ${formatClock(p.stop)}
      </div>

      <div>
        <strong>${escapeHTML(p.title)}</strong>
        <p>${escapeHTML(p.description)}</p>
      </div>
    `;

    guideList.appendChild(row);
  });
}

guideChannel.onchange=renderGuide;
guideDate.onchange=renderGuide;

/* ===============================
   ARCHÍV
================================ */

const archiveChannel=document.getElementById("archiveChannel");
const archiveDate=document.getElementById("archiveDate");
const archiveSearch=document.getElementById("archiveSearch");
const archiveList=document.getElementById("archiveList");

populateSelect(archiveChannel);
archiveDate.value=today();

function renderArchive(){
  const query=archiveSearch.value.toLowerCase();

  const items=archiveData.filter(item=>
    item.channel===archiveChannel.value&&
    (!archiveDate.value||item.date===archiveDate.value)&&
    item.title.toLowerCase().includes(query)
  );

  archiveList.innerHTML="";

  if(!items.length){
    archiveList.innerHTML=`
      <div class="empty">
        Archívne videá nie sú dostupné.
      </div>
    `;
    return;
  }

  const grid=document.createElement("div");
  grid.className="archive-grid";

  items.forEach(item=>{
    const card=document.createElement("div");
    card.className="archive-item";

    card.innerHTML=`
      <h4>${escapeHTML(item.title)}</h4>
      <p>${escapeHTML(item.date)}</p>
      <button class="control-btn">▶ Prehrať</button>
    `;

    card.querySelector("button").onclick=()=>{
      playArchive(item);
    };

    grid.appendChild(card);
  });

  archiveList.appendChild(grid);
}

archiveChannel.onchange=renderArchive;
archiveDate.onchange=renderArchive;
archiveSearch.oninput=renderArchive;

function playArchive(item){
  currentMode="archive";

  playerChannel.textContent=item.title;
  liveBadge.style.display="none";
  liveText.style.display="none";

  statusElement.textContent="Prehrávam archív.";

  loadSource(item.url);

  document.querySelector('[data-page="tv"]').click();
}

/* ===============================
   VYHĽADÁVANIE
================================ */

searchInput.oninput=()=>{
  renderChannels(searchInput.value);
};

/* ===============================
   HODINY
================================ */

function updateClock(){
  const now=new Date();

  document.getElementById("clock").textContent=
    now.toLocaleTimeString("sk-SK");

  playerClock.textContent=
    now.toLocaleTimeString("sk-SK");
}

function today(){
  return localDate(new Date());
}

function formatClock(date){
  return date.toLocaleTimeString("sk-SK",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function formatTime(seconds){
  if(!Number.isFinite(seconds))return "--:--";

  seconds=Math.floor(seconds);

  return `${Math.floor(seconds/3600)}:`+
    `${String(Math.floor(seconds%3600/60)).padStart(2,"0")}:`+
    `${String(seconds%60).padStart(2,"0")}`;
}

/* ===============================
   HTML OCHRANA
================================ */

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));
}

/* ===============================
   ŠTART
================================ */

renderChannels();
renderGuide();
renderArchive();

loadLive(channels[0]);

loadEPG();

updateClock();

setInterval(updateClock,1000);
setInterval(updateProgramNow,60000);

</script>

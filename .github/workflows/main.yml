name: Aktualizácia TV programu

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Stiahnuť repozitár
        uses: actions/checkout@v4

      - name: Stiahnuť a spracovať EPG
        run: |
          python3 - <<'PY'
          import urllib.request
          import gzip
          import xml.etree.ElementTree as ET
          import json
          import os
          from datetime import datetime

          url = "https://iptv-epg.org/files/epg-cz.xml.gz"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Streamivo-EPG/1.0"}
          )

          with urllib.request.urlopen(request, timeout=120) as response:
              data = response.read()

          if data[:2] == b"\x1f\x8b":
              data = gzip.decompress(data)

          root = ET.fromstring(data)

          def normalize(text):
              return (text or "").lower().replace("á", "a").replace("í", "i").replace("ý", "y").strip()

          channels = {}

          for channel in root.findall("channel"):
              channel_id = channel.get("id", "")
              names = [
                  item.text or ""
                  for item in channel.findall("display-name")
              ]

              combined = normalize(channel_id + " " + " ".join(names))

              if "joj" in combined:
                  channels[channel_id] = "joj"
              elif "markiza" in combined:
                  channels[channel_id] = "markiza"

          result = {
              "updatedAt": datetime.utcnow().isoformat() + "Z",
              "channels": {
                  "joj": {
                      "name": "JOJ",
                      "programmes": []
                  },
                  "markiza": {
                      "name": "Markíza",
                      "programmes": []
                  }
              }
          }

          for programme in root.findall("programme"):
              channel_id = programme.get("channel", "")
              target = channels.get(channel_id)

              if not target:
                  continue

              title = programme.find("title")
              desc = programme.find("desc")
              category = programme.find("category")

              result["channels"][target]["programmes"].append({
                  "start": programme.get("start", ""),
                  "stop": programme.get("stop", ""),
                  "title": title.text if title is not None else "",
                  "description": desc.text if desc is not None else "",
                  "category": category.text if category is not None else ""
              })

          for channel in result["channels"].values():
              channel["programmes"].sort(
                  key=lambda item: item["start"]
              )

          os.makedirs("data", exist_ok=True)

          with open("data/epg.json", "w", encoding="utf-8") as file:
              json.dump(result, file, ensure_ascii=False, indent=2)

          print("JOJ programov:", len(result["channels"]["joj"]["programmes"]))
          print("Markíza programov:", len(result["channels"]["markiza"]["programmes"]))
          print("EPG aktualizované.")
          PY

      - name: Uložiť aktualizovaný TV program
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epg.json
          git commit -m "Automatická aktualizácia TV programu" || echo "Program sa nezmenil"
          git push

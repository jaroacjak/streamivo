name: Streamivo GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EPG XML
        run: |
          mkdir -p data
          curl -L --fail \
            "https://iptv-epg.org/files/epg-cz.xml" \
            -o data/epg.xml

      - name: Convert XMLTV to JSON
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import json
          from datetime import datetime

          tree = ET.parse("data/epg.xml")
          root = tree.getroot()

          channels = []
          programmes = []

          for channel in root.findall("channel"):
              names = channel.findall("display-name")

              channels.append({
                  "id": channel.get("id"),
                  "name": names[0].text if names else channel.get("id")
              })

          for programme in root.findall("programme"):
              title = programme.find("title")
              desc = programme.find("desc")

              programmes.append({
                  "channel": programme.get("channel"),
                  "title": title.text if title is not None else "",
                  "description": desc.text if desc is not None else "",
                  "start": programme.get("start"),
                  "end": programme.get("stop")
              })

          programmes.sort(
              key=lambda p: p.get("start", "")
          )

          result = {
              "channels": channels,
              "program": programmes
          }

          with open("data/epg.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"Channels: {len(channels)}")
          print(f"Programmes: {len(programmes)}")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        

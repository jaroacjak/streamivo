
name: Streamivo - TV program a nasadenie

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Stiahnuť repozitár
        uses: actions/checkout@v4

      - name: Vytvoriť TV program
        run: |
          python3 <<'PY'
          import urllib.request
          import gzip
          import xml.etree.ElementTree as ET
          import json
          import os
          import re
          import unicodedata
          from datetime import datetime, timedelta, timezone

          URL = "https://iptv-epg.org/files/epg-cz.xml.gz"

          req = urllib.request.Request(
              URL,
              headers={"User-Agent": "Streamivo"}
          )

          with urllib.request.urlopen(req, timeout=60) as response:
              data = gzip.decompress(response.read())

          root = ET.fromstring(data)

          def norm(text):
              text = unicodedata.normalize("NFKD", text or "")
              text = "".join(
                  c for c in text
                  if not unicodedata.combining(c)
              )
              return re.sub(r"[^a-z0-9]", "", text.lower())

          def parse_date(value):
              if not value:
                  return None

              match = re.match(
                  r"(\d{14})(?:\s*([+-]\d{4}))?",
                  value.strip()
              )

              if not match:
                  return None

              dt = datetime.strptime(
                  match.group(1),
                  "%Y%m%d%H%M%S"
              )

              offset = match.group(2)

              if offset:
                  sign = 1 if offset[0] == "+" else -1
                  hours = int(offset[1:3])
                  minutes = int(offset[3:5])

                  tz = timezone(
                      sign * timedelta(
                          hours=hours,
                          minutes=minutes
                      )
                  )
              else:
                  tz = timezone.utc

              return dt.replace(tzinfo=tz).isoformat()

          channel_mapping = {}

          for channel in root.findall("channel"):
              channel_id = channel.get("id", "")

              names = [
                  n.text.strip()
                  for n in channel.findall("display-name")
                  if n.text
              ]

              all_names = [channel_id] + names
              normalized = [norm(n) for n in all_names]

              is_joj = any(
                  n.startswith("joj")
                  and "cinema" not in n
                  for n in normalized
              )

              is_markiza = any(
                  n.startswith("markiza")
                  for n in normalized
              )

              if is_joj:
                  channel_mapping[channel_id] = "joj"

              elif is_markiza:
                  channel_mapping[channel_id] = "markiza"

          programs = []

          for p in root.findall("programme"):
              channel_id = p.get("channel", "")
              channel = channel_mapping.get(channel_id)

              if channel not in ("joj", "markiza"):
                  continue

              start = parse_date(p.get("start"))
              stop = parse_date(p.get("stop"))

              if not start or not stop:
                  continue

              title_element = p.find("title")
              desc_element = p.find("desc")

              title = (
                  title_element.text.strip()
                  if title_element is not None
                  and title_element.text
                  else "Bez názvu"
              )

              description = (
                  desc_element.text.strip()
                  if desc_element is not None
                  and desc_element.text
                  else ""
              )

              programs.append({
                  "channel": channel,
                  "start": start,
                  "stop": stop,
                  "title": title,
                  "description": description
              })

          programs.sort(key=lambda x: x["start"])

          result = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "channels": [
                  {"id": "joj", "name": "JOJ"},
                  {"id": "markiza", "name": "Markíza"}
              ],
              "programs": programs
          }

          os.makedirs("data", exist_ok=True)

          with open(
              "data/epg.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Počet programov:", len(programs))
          print("Rozpoznané kanály:", channel_mapping)
          PY

      - name: Uložiť TV program do repozitára
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epg.json
          git commit -m "Automatická aktualizácia TV programu" || echo "Bez zmien"
          git push

      - name: Nastaviť GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrať stránku
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Nasadiť stránku
        id: deployment
        uses: actions/deploy-pages@v4
        

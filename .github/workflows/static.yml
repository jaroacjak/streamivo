name: Streamivo GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/archive.json"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EPG XML
        run: |
          mkdir -p data

          curl -L --fail --retry 3 --retry-delay 5 \
            "https://iptv-epg.org/files/epg-cz.xml" \
            -o data/epg.xml

      - name: Convert XMLTV to JSON
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import json

          tree = ET.parse("data/epg.xml")
          root = tree.getroot()

          channels = []
          programmes = []

          for channel in root.findall("channel"):
              names = channel.findall("display-name")

              channels.append({
                  "id": channel.get("id", ""),
                  "name": names[0].text if names and names[0].text else channel.get("id", "")
              })

          for programme in root.findall("programme"):
              title = programme.find("title")
              desc = programme.find("desc")

              programmes.append({
                  "channel": programme.get("channel", ""),
                  "title": title.text if title is not None and title.text else "",
                  "description": desc.text if desc is not None and desc.text else "",
                  "start": programme.get("start", ""),
                  "end": programme.get("stop", "")
              })

          programmes.sort(key=lambda p: p.get("start", ""))

          result = {
              "channels": channels,
              "program": programmes
          }

          with open("data/epg.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"Channels: {len(channels)}")
          print(f"Programmes: {len(programmes)}")
          PY

          rm -f data/epg.xml

      - name: Update Archive Catalogue
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone, timedelta

          EPG_FILE = "data/epg.json"
          ARCHIVE_FILE = "data/archive.json"

          with open(EPG_FILE, encoding="utf-8") as f:
              epg = json.load(f)

          if os.path.exists(ARCHIVE_FILE):
              with open(ARCHIVE_FILE, encoding="utf-8") as f:
                  archive = json.load(f)
          else:
              archive = {"channels": [], "programs": []}

          if isinstance(archive, list):
              old_programs = archive
              archive_channels = []
          else:
              old_programs = archive.get(
                  "programs",
                  archive.get("program", [])
              )
              archive_channels = archive.get("channels", [])

          if not isinstance(old_programs, list):
              old_programs = []

          now = datetime.now(timezone.utc)

          channel_names = {}

          for channel in epg.get("channels", []):
              channel_id = str(channel.get("id", "")).lower()
              channel_name = str(channel.get("name", "")).lower()

              channel_names[channel_id] = channel_name

          def parse_date(value):
              if not value:
                  return None

              try:
                  value = str(value).strip()

                  if len(value) >= 14 and value[:14].isdigit():
                      date = datetime.strptime(
                          value[:14], "%Y%m%d%H%M%S"
                      )

                      offset = value[14:].strip()

                      if offset:
                          match = re.search(
                              r"([+-])(\d{2})(\d{2})",
                              offset
                          )

                          if match:
                              sign = 1 if match.group(1) == "+" else -1
                              hours = int(match.group(2))
                              minutes = int(match.group(3))

                              tz = timezone(
                                  sign * timedelta(
                                      hours=hours,
                                      minutes=minutes
                                  )
                              )

                              date = date.replace(tzinfo=tz)
                          else:
                              date = date.replace(tzinfo=timezone.utc)
                      else:
                          date = date.replace(tzinfo=timezone.utc)

                      return date.astimezone(timezone.utc)

                  date = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )

                  if date.tzinfo is None:
                      date = date.replace(tzinfo=timezone.utc)

                  return date.astimezone(timezone.utc)

              except Exception:
                  return None

          def normalize_channel(program):
              channel = str(program.get("channel", "")).lower()
              name = str(program.get("channelName", "")).lower()

              epg_name = channel_names.get(channel, "")

              text = channel + " " + name + " " + epg_name

              if "markiza" in text or "markíza" in text:
                  return "markiza"

              if "joj" in text:
                  return "joj"

              return channel or name or "unknown"

          def make_key(program):
              channel = normalize_channel(program)

              title = str(
                  program.get("title", "")
              ).strip().lower()

              start = str(
                  program.get("start", "")
              ).strip()

              return channel, title, start

          existing = set()

          for p in old_programs:
              existing.add(make_key(p))

          added = 0

          for p in epg.get("program", []):
              end = parse_date(p.get("end"))

              # Do archívu pridávame iba skončené relácie.
              if not end or end > now:
                  continue

              channel = normalize_channel(p)

              title = str(
                  p.get("title", "")
              ).strip()

              if not title:
                  continue

              key = (
                  channel.lower(),
                  title.lower(),
                  str(p.get("start", "")).strip()
              )

              if key in existing:
                  continue

              old_programs.append({
                  "channel": channel,
                  "title": title,
                  "description": p.get("description", ""),
                  "start": p.get("start", ""),
                  "end": p.get("end", ""),
                  "channelName": (
                      "JOJ" if channel == "joj"
                      else "Markíza" if channel == "markiza"
                      else channel
                  ),
                  "archived": True,
                  "videoAvailable": False
              })

              existing.add(key)
              added += 1

          def sort_date(program):
              date = parse_date(program.get("start"))
              return date.timestamp() if date else 0

          old_programs.sort(
              key=sort_date,
              reverse=True
          )

          result = {
              "channels": archive_channels or [
                  {"id": "joj", "name": "JOJ"},
                  {"id": "markiza", "name": "Markíza"}
              ],
              "programs": old_programs
          }

          with open(ARCHIVE_FILE, "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"Archive entries added: {added}")
          print(f"Total archive entries: {len(old_programs)}")
          PY

      - name: Save Archive Catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/archive.json

          if git diff --cached --quiet; then
            echo "Archive catalogue unchanged."
          else
            git commit -m "Update archive catalogue"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        
